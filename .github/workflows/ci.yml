# Every push and pull request: the JS and PHP suites, the typecheck, and both builds.
# (Laravel Cloud deploys main on push; a red run here means the deploy shipped something broken.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS tests, typecheck, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Capture tests run the extension's fixtures in the runner's Chrome.
      - run: npm test
      - run: npm run build
      - run: npm run build:laravel
      - run: npm run extension:build

  php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # The Blade view needs the Vite manifest; the feature tests skip Vite, but build it so the page renders.
      - run: npm ci && npm run build:laravel
      - run: php artisan test
