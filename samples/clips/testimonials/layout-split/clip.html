<section class="mx-testimonials-layout-split" data-mx-section="testimonials">
  <div class="container">
    <figure class="story" data-mx-block="card" data-mx-label="Story">
      <p class="eyebrow" data-mx-block="badge" data-mx-field="eyebrow">Customer story</p>
      <blockquote class="quote">
        <p data-mx-block="text" data-mx-field="q1Quote">It took the guesswork out of starting. We went from a blank page to something we were proud of in a single afternoon.</p>
      </blockquote>
      <figcaption class="person">
        <span class="name" data-mx-block="text" data-mx-field="q1Name">Alex Morgan</span>
        <span class="role" data-mx-block="text" data-mx-field="q1Role">Head of Design</span>
      </figcaption>
      <div class="stats" data-mx-block="list" data-mx-list="stats">
        <div class="stat" data-mx-block="item" data-mx-label="Stat">
          <p class="value" data-mx-block="heading" data-mx-field="stat1Value">3×</p>
          <p class="label" data-mx-block="text" data-mx-field="stat1Label">faster launches</p>
        </div>
        <div class="stat" data-mx-block="item" data-mx-label="Stat">
          <p class="value" data-mx-block="heading" data-mx-field="stat2Value">40%</p>
          <p class="label" data-mx-block="text" data-mx-field="stat2Label">less time in review</p>
        </div>
      </div>
    </figure>
    <div class="portrait" data-mx-block="image" data-mx-media="portrait" data-mx-ratio="4/5" aria-hidden="true">
      <span class="figure"></span>
      <span class="badge"><i></i><b></b></span>
    </div>
  </div>
</section>
