<section class="mx-testimonials-layout-split" data-mx-section="testimonials">
  <div class="inner">
    <figure class="story">
      <p class="eyebrow" data-mx-field="eyebrow">Customer story</p>
      <blockquote class="quote">
        <p data-mx-field="q1Quote">It took the guesswork out of starting. We went from a blank page to something we were proud of in a single afternoon.</p>
      </blockquote>
      <figcaption class="person">
        <span class="name" data-mx-field="q1Name">Alex Morgan</span>
        <span class="role" data-mx-field="q1Role">Head of Design</span>
      </figcaption>
      <div class="stats">
        <div class="stat">
          <p class="value" data-mx-field="stat1Value">3×</p>
          <p class="label" data-mx-field="stat1Label">faster launches</p>
        </div>
        <div class="stat">
          <p class="value" data-mx-field="stat2Value">40%</p>
          <p class="label" data-mx-field="stat2Label">less time in review</p>
        </div>
      </div>
    </figure>
    <div class="portrait" aria-hidden="true">
      <span class="figure"></span>
      <span class="badge"><i></i><b></b></span>
    </div>
  </div>
</section>
