<section class="mx-testimonials-marginalia-quote" data-mx-section="testimonials">

      <h2 class="heading" data-mx-field="heading">What our readers wrote back</h2>

    <div class="main">
      <figure class="lead">
        <span class="mark" aria-hidden="true">“</span>
        <blockquote class="quote">
          <p data-mx-field="q1Quote">It is the first app that has ever made me read more slowly, and remember more of what I read.</p>
        </blockquote>
        <figcaption class="cite">
          <span class="dash" aria-hidden="true"></span>
          <span class="name" data-mx-field="q1Name">Helen Aldous</span>
          <span class="role" data-mx-field="q1Role">Essayist, The Quarterly</span>
        </figcaption>
      </figure>

      <aside class="numbers">
        <p class="label">By the numbers</p>
        <div class="stat">
          <p class="value" data-mx-field="stat1Value">2.1m</p>
          <p class="stat-label" data-mx-field="stat1Label">notes left in the margin</p>
        </div>
        <div class="stat">
          <p class="value" data-mx-field="stat2Value">38 min</p>
          <p class="stat-label" data-mx-field="stat2Label">average reading sitting</p>
        </div>
        <div class="stat">
          <p class="value" data-mx-field="stat3Value">96%</p>
          <p class="stat-label" data-mx-field="stat3Label">return within a season</p>
        </div>
      </aside>
    </div>

    <div class="pair">
      <figure class="minor">
        <blockquote class="quote">
          <p data-mx-field="q2Quote">My commonplace book finally lives in one place instead of eleven notebooks and a shoebox.</p>
        </blockquote>
        <figcaption class="cite">
          <span class="dash" aria-hidden="true"></span>
          <span class="name" data-mx-field="q2Name">Tomás Reyes</span>

        </figcaption>
      </figure>
      <figure class="minor">
        <blockquote class="quote">
          <p data-mx-field="q3Quote">The footnotes open beside the text. I didn’t know how much I needed that until I had it.</p>
        </blockquote>
        <figcaption class="cite">
          <span class="dash" aria-hidden="true"></span>
          <span class="name" data-mx-field="q3Name">Ada Whitlock</span>
          <span class="role" data-mx-field="q3Role">Librarian, Halden College</span>
        </figcaption>
      </figure>
