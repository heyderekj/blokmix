<section class="mx-logos-layout-slider" data-mx-section="logos">
  <div class="container">
    <div class="top">
      <div class="titles">
        <p class="eyebrow" data-mx-block="badge" data-mx-field="eyebrow">Customers</p>
        <h2 class="heading" data-mx-block="heading" data-mx-field="heading">Teams who switched and stayed</h2>
      </div>
      <fieldset class="pager">
        <legend class="sr">Logo pages</legend>
        <input class="sr" type="radio" name="mx-logos-layout-slider-page" id="mx-logos-layout-slider-p1" aria-label="First page" checked>
        <input class="sr" type="radio" name="mx-logos-layout-slider-page" id="mx-logos-layout-slider-p2" aria-label="Second page">
        <label class="arrow prev" for="mx-logos-layout-slider-p1"><span class="sr">Previous</span><svg data-mx-icon="arrow-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></label>
        <span class="count" aria-hidden="true"><span class="c1">01</span><span class="c2">02</span><span class="of">/ 02</span></span>
        <label class="arrow next" for="mx-logos-layout-slider-p2"><span class="sr">Next</span><svg data-mx-icon="arrow-right" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></label>
      </fieldset>
    </div>
    <div class="viewport">
      <ul class="track" data-mx-block="list" data-mx-list="logos">
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l1" data-mx-block="image" data-mx-media="logo1" data-mx-ratio="4/1" data-mx-field="logo1">Fernhill</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l2" data-mx-block="image" data-mx-media="logo2" data-mx-ratio="4/1" data-mx-field="logo2">Quarry</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l3" data-mx-block="image" data-mx-media="logo3" data-mx-ratio="4/1" data-mx-field="logo3">Northwind</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l4" data-mx-block="image" data-mx-media="logo4" data-mx-ratio="4/1" data-mx-field="logo4">Halcyon</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l5" data-mx-block="image" data-mx-media="logo5" data-mx-ratio="4/1" data-mx-field="logo5">Lumen</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l6" data-mx-block="image" data-mx-media="logo6" data-mx-ratio="4/1" data-mx-field="logo6">Ostara</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l7" data-mx-block="image" data-mx-media="logo7" data-mx-ratio="4/1" data-mx-field="logo7">Kettle</span></li>
        <li class="cell" data-mx-block="item" data-mx-label="Logo"><span class="logo l8" data-mx-block="image" data-mx-media="logo8" data-mx-ratio="4/1" data-mx-field="logo8">Bramble</span></li>
      </ul>
    </div>
    <div class="dots" aria-hidden="true">
      <label class="dot d1" for="mx-logos-layout-slider-p1"></label>
      <label class="dot d2" for="mx-logos-layout-slider-p2"></label>
    </div>
  </div>
</section>
