<section class="mx-hero-layout-slider" data-mx-section="hero">
  <div class="container grid split">
    <div class="head copy">
      <p class="eyebrow" data-mx-block="badge" data-mx-field="eyebrow">Neighbourhood bakery since the corner shop days</p>
      <h1 class="heading display" data-mx-block="heading" data-mx-field="headline">Bread worth getting up early for</h1>
      <p class="lead" data-mx-block="text" data-mx-field="subhead">Slow sourdough, seasonal pastries and a proper cup of coffee, baked through the night and on the counter by seven.</p>
      <div class="actions">
        <a href="#" class="btn primary" data-mx-block="button" data-mx-field="ctaPrimary">Order for pickup</a>
        <a href="#" class="btn secondary" data-mx-block="button" data-mx-field="ctaSecondary">See this week’s bakes</a>
      </div>
      <p class="note" data-mx-block="text" data-mx-field="note">Open every day from seven · Closed Mondays</p>
    </div>
    <div class="slider">
      <div class="track">
        <div class="media slide s1" data-mx-block="image" data-mx-media="slide1" data-mx-ratio="1/1">
          <div class="art dots"></div>
          <span class="orb o1"></span>
          <span class="slab h1"></span>
        </div>
        <div class="media slide s2" data-mx-block="image" data-mx-media="slide2" data-mx-ratio="1/1">
          <span class="slab p1"></span>
          <span class="slab p2"></span>
          <span class="slab p3"></span>
        </div>
        <div class="media slide s3" data-mx-block="image" data-mx-media="slide3" data-mx-ratio="1/1">
          <div class="art dots"></div>
          <span class="orb o2"></span>
          <span class="orb o3"></span>
        </div>
      </div>
      <div class="bar">
        <span class="count" aria-hidden="true"><span class="n n1">01</span><span class="n n2">02</span><span class="n n3">03</span> / 03</span>
        <div class="dots-nav" role="radiogroup" aria-label="Slides">
          <label class="dot d1"><input type="radio" name="mx-hero-layout-slider-slide" aria-label="Show slide 1" checked></label>
          <label class="dot d2"><input type="radio" name="mx-hero-layout-slider-slide" aria-label="Show slide 2"></label>
          <label class="dot d3"><input type="radio" name="mx-hero-layout-slider-slide" aria-label="Show slide 3"></label>
        </div>
      </div>
    </div>
  </div>
</section>
