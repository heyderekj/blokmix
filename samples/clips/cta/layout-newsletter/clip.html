<section class="mx-cta-layout-newsletter" data-mx-section="cta">
  <div class="inner">
    <span class="mark" data-mx-block="icon" aria-hidden="true">
      <svg data-mx-icon="mail" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
    </span>
    <p data-mx-block="badge" class="eyebrow" data-mx-field="eyebrow">Stay in the loop</p>
    <h2 data-mx-block="heading" class="heading" data-mx-field="heading">Get the good stuff in your inbox</h2>
    <p data-mx-block="text" class="body" data-mx-field="body">One short email a month with new releases, field notes and ideas worth stealing.</p>
    <form class="form" action="#" data-mx-block="card" data-mx-label="Form">
      <input class="input" data-mx-block="input" type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email">
      <button data-mx-block="button" class="submit" type="submit" data-mx-field="ctaPrimary">Subscribe</button>
    </form>
    <div class="meta">
      <p data-mx-block="text" class="note" data-mx-field="note">No spam. Unsubscribe any time.</p>
      <span class="sep" aria-hidden="true"></span>
      <a data-mx-block="link" href="#" class="link" data-mx-field="ctaSecondary">Read past issues</a>
    </div>
  </div>
</section>
