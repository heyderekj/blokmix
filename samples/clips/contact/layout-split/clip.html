<section class="mx-contact-layout-split" data-mx-section="contact">
  <div class="wrap">
    <div class="info">
      <p class="eyebrow" data-mx-field="eyebrow">Contact</p>
      <h2 class="heading" data-mx-field="heading">Let’s talk about your project</h2>
      <p class="intro" data-mx-field="intro">Questions, feedback or an idea you want to try. Send a note and a real person will get back to you.</p>
      <ul class="details">
        <li class="detail">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <a href="#" class="value" data-mx-field="email">hello@studio.example</a>
        </li>
        <li class="detail">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
          <a href="#" class="value" data-mx-field="phone">+1 (555) 010-0000</a>
        </li>
        <li class="detail">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
          <span class="value" data-mx-field="address">123 Market Street, Springfield</span>
        </li>
      </ul>
    </div>
    <form class="card">
      <div class="field">
        <label class="label" for="mx-contact-layout-split-name" data-mx-field="nameLabel">Your name</label>
        <input class="input" id="mx-contact-layout-split-name" type="text" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label class="label" for="mx-contact-layout-split-email" data-mx-field="emailLabel">Email</label>
        <input class="input" id="mx-contact-layout-split-email" type="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="label" for="mx-contact-layout-split-message" data-mx-field="messageLabel">Message</label>
        <textarea class="input area" id="mx-contact-layout-split-message" name="message" rows="5"></textarea>
      </div>
      <div class="foot">
        <button class="submit" type="button" data-mx-field="submit">Send message</button>
        <p class="note" data-mx-field="note">We usually reply within a day.</p>
      </div>
    </form>
  </div>
</section>
