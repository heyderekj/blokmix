<section class="mx-contact-layout-split" data-mx-section="contact">
  <div class="container">
    <div class="info">
      <p data-mx-block="badge" class="eyebrow" data-mx-field="eyebrow">Contact</p>
      <h2 data-mx-block="heading" class="heading" data-mx-field="heading">Let’s talk about your project</h2>
      <p data-mx-block="text" class="lead" data-mx-field="intro">Questions, feedback or an idea you want to try. Send a note and a real person will get back to you.</p>
      <ul class="details" data-mx-block="list" data-mx-list="contacts">
        <li class="detail" data-mx-block="item" data-mx-label="Contact">
          <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></svg></span>
          <a data-mx-block="link" href="#" class="value" data-mx-field="email">hello@studio.example</a>
        </li>
        <li class="detail" data-mx-block="item" data-mx-label="Contact">
          <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="phone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></svg></span>
          <a data-mx-block="link" href="#" class="value" data-mx-field="phone">+1 (555) 010-0000</a>
        </li>
        <li class="detail" data-mx-block="item" data-mx-label="Contact">
          <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="map-pin" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /></svg></span>
          <span data-mx-block="text" class="value" data-mx-field="address">123 Market Street, Springfield</span>
        </li>
      </ul>
    </div>
    <form class="card" data-mx-block="card" data-mx-label="Form">
      <div class="field">
        <label data-mx-block="text" class="label" for="mx-contact-layout-split-name" data-mx-field="nameLabel">Your name</label>
        <input class="input" data-mx-block="input" id="mx-contact-layout-split-name" type="text" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label data-mx-block="text" class="label" for="mx-contact-layout-split-email" data-mx-field="emailLabel">Email</label>
        <input class="input" data-mx-block="input" id="mx-contact-layout-split-email" type="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label data-mx-block="text" class="label" for="mx-contact-layout-split-message" data-mx-field="messageLabel">Message</label>
        <textarea class="input area" data-mx-block="input" id="mx-contact-layout-split-message" name="message" rows="5"></textarea>
      </div>
      <div class="foot">
        <button data-mx-block="button" class="submit" type="button" data-mx-field="submit">Send message</button>
        <p data-mx-block="text" class="note" data-mx-field="note">We usually reply within a day.</p>
      </div>
    </form>
  </div>
</section>
