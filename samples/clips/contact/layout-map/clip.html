<section class="mx-contact-layout-map" data-mx-section="contact">
  <div class="container">
    <div class="grid split top">
      <div class="col-6 media map" aria-hidden="true" data-mx-block="image" data-mx-media="map" data-mx-ratio="4/5"><svg class="x" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 100 100M100 0 0 100"/></svg></div>
      <div class="col-5 start-8 side">
        <div class="head">
          <p class="eyebrow" data-mx-block="badge" data-mx-field="eyebrow">Visit or write</p>
          <h2 class="heading" data-mx-block="heading" data-mx-field="heading">Come and see the studio</h2>
          <p class="lead" data-mx-block="text" data-mx-field="intro">We’re a short walk from the river. Drop in for a coffee, or send a note and we’ll set a time.</p>
        </div>
        <ul class="details" data-mx-block="list" data-mx-list="contacts">
          <li class="detail" data-mx-block="item" data-mx-label="Contact">
            <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="map-pin" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /></svg></span>
            <span data-mx-block="text" data-mx-field="address">14 Canal Yard, Portland, OR</span>
          </li>
          <li class="detail" data-mx-block="item" data-mx-label="Contact">
            <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></svg></span>
            <a href="#" data-mx-block="link" data-mx-field="email">hello@fernandmoss.studio</a>
          </li>
          <li class="detail" data-mx-block="item" data-mx-label="Contact">
            <span class="icon inline" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="phone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></svg></span>
            <a href="#" data-mx-block="link" data-mx-field="phone">+1 (555) 014-2290</a>
          </li>
        </ul>
        <form class="form" data-mx-block="card" data-mx-label="Form">
          <label class="field">
            <span class="label" data-mx-block="text" data-mx-field="emailLabel">Your email</span>
            <input class="input" data-mx-block="input" type="email" name="email" autocomplete="email">
          </label>
          <label class="field">
            <span class="label" data-mx-block="text" data-mx-field="messageLabel">Message</span>
            <textarea class="input area" data-mx-block="input" name="message" rows="3"></textarea>
          </label>
          <div class="actions">
            <button type="button" class="btn primary" data-mx-block="button" data-mx-field="submit">Send</button>
            <p class="note" data-mx-block="text" data-mx-field="note">We reply the same week.</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
