<section class="mx-contact-layout-form" data-mx-section="contact">
  <div class="container">
    <div class="head center">
      <p class="eyebrow" data-mx-block="badge" data-mx-field="eyebrow">Contact</p>
      <h2 class="heading" data-mx-block="heading" data-mx-field="heading">Tell me about your project</h2>
      <p class="lead" data-mx-block="text" data-mx-field="intro">A few lines is plenty. I’ll reply with a couple of questions and a time to talk.</p>
    </div>
    <form class="card form" data-mx-block="card" data-mx-label="Form">
      <div class="grid fields">
        <label class="col-6 field">
          <span class="label" data-mx-block="text" data-mx-field="nameLabel">Your name</span>
          <input class="input" data-mx-block="input" type="text" name="name" autocomplete="name">
        </label>
        <label class="col-6 field">
          <span class="label" data-mx-block="text" data-mx-field="emailLabel">Email</span>
          <input class="input" data-mx-block="input" type="email" name="email" autocomplete="email">
        </label>
        <label class="col-12 field">
          <span class="label" data-mx-block="text" data-mx-field="messageLabel">What are you working on?</span>
          <textarea class="input area" data-mx-block="input" name="message" rows="5"></textarea>
        </label>
      </div>
      <button type="button" class="btn primary" data-mx-block="button" data-mx-field="submit">Send message</button>
      <p class="note" data-mx-block="text" data-mx-field="note">I reply within two working days.</p>
    </form>
    <a href="#" class="mail" data-mx-block="link"><svg data-mx-icon="mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span data-mx-field="email">hello@fernandmoss.studio</span></a>
  </div>
</section>
