<section class="mx-contact-layout-cards" data-mx-section="contact">
  <div class="wrap">
    <div class="head">
      <p data-mx-block="badge" class="eyebrow" data-mx-field="eyebrow">Contact</p>
      <h2 data-mx-block="heading" class="heading" data-mx-field="heading">We’d love to hear from you</h2>
      <p data-mx-block="text" class="intro" data-mx-field="intro">Pick whichever way suits you best. Every message lands with the team, not a queue.</p>
    </div>
    <ul class="cards" data-mx-block="list" data-mx-list="contacts">
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="tile" data-mx-block="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <span class="kind">Email</span>
        <a data-mx-block="link" href="#" class="value" data-mx-field="email">hello@studio.example</a>
      </li>
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="tile" data-mx-block="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
        <span class="kind">Phone</span>
        <a data-mx-block="link" href="#" class="value" data-mx-field="phone">+1 (555) 010-0000</a>
      </li>
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="tile" data-mx-block="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
        <span class="kind">Office</span>
        <span data-mx-block="text" class="value" data-mx-field="address">123 Market Street, Springfield</span>
      </li>
    </ul>
    <p data-mx-block="text" class="note" data-mx-field="note">We usually reply within a day.</p>
  </div>
</section>
