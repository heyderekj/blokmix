<section class="mx-contact-layout-cards" data-mx-section="contact">
  <div class="container">
    <div class="head">
      <p data-mx-block="badge" class="eyebrow" data-mx-field="eyebrow">Contact</p>
      <h2 data-mx-block="heading" class="heading" data-mx-field="heading">We’d love to hear from you</h2>
      <p data-mx-block="text" class="lead" data-mx-field="intro">Pick whichever way suits you best. Every message lands with the team, not a queue.</p>
    </div>
    <ul class="cards" data-mx-block="list" data-mx-list="contacts">
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="icon" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="mail" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></svg></span>
        <span class="kind">Email</span>
        <a data-mx-block="link" href="#" class="value" data-mx-field="email">hello@studio.example</a>
      </li>
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="icon" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="phone" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></svg></span>
        <span class="kind">Phone</span>
        <a data-mx-block="link" href="#" class="value" data-mx-field="phone">+1 (555) 010-0000</a>
      </li>
      <li class="card" data-mx-block="item" data-mx-label="Contact">
        <span class="icon" data-mx-block="icon" aria-hidden="true"><svg data-mx-icon="map-pin" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /></svg></span>
        <span class="kind">Office</span>
        <span data-mx-block="text" class="value" data-mx-field="address">123 Market Street, Springfield</span>
      </li>
    </ul>
    <p data-mx-block="text" class="note" data-mx-field="note">We usually reply within a day.</p>
  </div>
</section>
